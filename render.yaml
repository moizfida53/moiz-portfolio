# Render Blueprint — deploys this Angular app as a free static site.
# Render → New → Blueprint → pick this repo. Every push to main redeploys.
services:
  - type: web
    name: moiz-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/moiz-portfolio/browser
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      # Single-page app: let Angular's router handle /projects/... deep links.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
